name: Traffic Spike Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/blogging-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/blogging-agent/requirements.txt

      - name: Configure credentials
        env:
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID || '505035310' }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || 'sc-domain:changeimageto.com' }}
        run: python scripts/blogging-agent/setup_ci.py

      - name: Run traffic spike report
        working-directory: scripts/blogging-agent
        env:
          TRAFFIC_REPORT_PATH: ${{ github.workspace }}/traffic_spike_report.json
        run: python ../traffic_spike_report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: traffic-spike-report
          path: traffic_spike_report.json
          retention-days: 7
