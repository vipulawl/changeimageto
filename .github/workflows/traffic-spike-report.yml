name: Traffic Spike Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/blogging-agent/requirements.txt

      - name: Install dependencies
        run: pip install google-analytics-data google-api-python-client google-auth

      - name: Write GA4/GSC credentials
        env:
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID || '505035310' }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || 'sc-domain:changeimageto.com' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          agent = Path("scripts/blogging-agent")
          agent.mkdir(parents=True, exist_ok=True)
          ga4 = (os.environ.get("GA4_CREDENTIALS_JSON") or "").strip()
          gsc = (os.environ.get("GSC_CREDENTIALS_JSON") or "").strip()
          if not ga4 and not gsc:
              raise SystemExit("Missing GA4/GSC credentials secrets")
          if ga4:
              json.loads(ga4)
              (agent / "google-credentials-ga4.json").write_text(ga4)
          if gsc:
              json.loads(gsc)
              (agent / "google-credentials-gsc.json").write_text(gsc)
          if ga4 and not gsc:
              (agent / "google-credentials-gsc.json").write_text(ga4)
          if gsc and not ga4:
              (agent / "google-credentials-ga4.json").write_text(gsc)
          print("GA4 creds written:", (agent / "google-credentials-ga4.json").exists())
          print("GSC creds written:", (agent / "google-credentials-gsc.json").exists())
          PY
          echo "GA4_PROPERTY_ID=${GA4_PROPERTY_ID}" >> "$GITHUB_ENV"
          echo "GSC_SITE_URL=${GSC_SITE_URL}" >> "$GITHUB_ENV"
          echo "GOOGLE_GA4_CREDENTIALS_FILE=${GITHUB_WORKSPACE}/scripts/blogging-agent/google-credentials-ga4.json" >> "$GITHUB_ENV"
          echo "GOOGLE_GSC_CREDENTIALS_FILE=${GITHUB_WORKSPACE}/scripts/blogging-agent/google-credentials-gsc.json" >> "$GITHUB_ENV"

      - name: Run traffic spike report
        env:
          TRAFFIC_REPORT_PATH: ${{ github.workspace }}/traffic_spike_report.json
        run: python scripts/traffic_spike_report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: traffic-spike-report
          path: traffic_spike_report.json
          retention-days: 7
